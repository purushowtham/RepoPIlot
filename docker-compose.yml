x-environment: &environment
  DATABASE_URL: postgresql+psycopg://repopilot:repopilot@db:5432/repopilot
  DATA_DIR: /data
  LANGGRAPH_STRICT_MSGPACK: "true"
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: repopilot
      POSTGRES_PASSWORD: repopilot
      POSTGRES_DB: repopilot
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U repopilot"]
      interval: 3s
      retries: 20
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment: *environment
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    volumes: ["app_data:/data"]
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 5s
      retries: 20
  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment: *environment
    command: ["python", "-m", "app.worker"]
    volumes: ["app_data:/data", "/var/run/docker.sock:/var/run/docker.sock"]
    depends_on:
      api: {condition: service_healthy}
  dashboard:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports: ["127.0.0.1:5173:80"]
    depends_on:
      api: {condition: service_healthy}
volumes:
  postgres_data:
  app_data:
